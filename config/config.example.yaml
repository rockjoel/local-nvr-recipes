mqtt:
  enabled: true
  host: mosquitto

tls:
  enabled: false

birdseye:
  enabled: false

# Credenziali RTSP da variabili d'ambiente (.env)
go2rtc:
  streams:
    cam:
      - "rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_CAMERA_HOST}:554/stream1"
    cam_sub:
      - "rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@{FRIGATE_CAMERA_HOST}:554/stream2"

cameras:
  cam:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      fps: 5
    record:
      enabled: false
    snapshots:
      enabled: false

version: 0.14-0
